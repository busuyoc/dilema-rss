name: Scrape Dilema Veche

on:
  schedule:
    - cron: '0 10 * * 4'  # joi 10:00 UTC = 12:00 RO iarna / 13:00 RO vara (DST)
    - cron: '0 16 * * 4'  # retry joi 16:00 UTC — acoperă flake-uri de runner (ex. 2026-07-09)
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep enough for the guard below to see past any hand-pushed commits
          # that landed after the morning's feed commit.
          fetch-depth: 20

      # The 16:00 retry cron must not duplicate a successful 10:00 run. Scanning
      # recent history rather than HEAD alone: any commit pushed after the feed
      # commit would otherwise hide it and trigger a pointless re-scrape.
      - name: Skip if today's feed already committed
        id: guard
        run: |
          if git log --format=%s -20 | grep -qx "feed: $(date -u +%Y-%m-%d)"; then
            echo "Feed already committed today — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.skip != 'true'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Run tests
        if: steps.guard.outputs.skip != 'true'
        run: bun test

      - name: Run scraper
        if: steps.guard.outputs.skip != 'true'
        run: bun run scrape
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml

      # The book must be spec-valid before it ships to a device. A malformed
      # EPUB fails the run here instead of failing on the reader on Thursday.
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate EPUB
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.1.0/epubcheck.jar dilema-latest.epub

      - name: Commit feed
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "dilema-rss"
          git config user.email "bot@users.noreply.github.com"
          git add feed.xml catalog.xml dilema-*.epub dilema-latest.epub
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feed: $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushing is not publishing. On 2026-08-06 this workflow went green, the
      # commit landed, and the Pages build errored — so the site served the
      # previous issue for a week and the device correctly downloaded nothing.
      # The run is not done until the deploy that serves readers has succeeded.
      - name: Verify Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "Waiting for the Pages build of $sha"
          for _ in $(seq 1 40); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
              --jq '"\(.commit) \(.status)"' 2>/dev/null || echo "")
            built_sha=${build%% *}
            build_status=${build##* }
            if [ "$built_sha" = "$sha" ]; then
              case "$build_status" in
                built)
                  echo "Pages deployed $sha"
                  exit 0 ;;
                errored)
                  echo "::error::Pages build failed for $sha — the commit landed but readers still see the old issue. Re-run this workflow or redeploy Pages."
                  exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::Timed out after 10min waiting for the Pages build of $sha (last seen: ${build:-none})."
          exit 1
