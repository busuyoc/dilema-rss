name: Scrape Dilema Veche

on:
  schedule:
    - cron: '0 10 * * 4'  # joi 10:00 UTC = 12:00 RO iarna / 13:00 RO vara (DST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run scraper
        run: bun run scrape
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tools/archive/go.sum

      - name: Update archive database
        run: |
          go build -C tools/archive -o dilema-archive .
          tools/archive/dilema-archive ingest articles.jsonl
          tools/archive/dilema-archive stats

      - name: Commit feed
        run: |
          git config user.name "dilema-rss"
          git config user.email "bot@users.noreply.github.com"
          git add feed.xml articles.jsonl dilema.db dilema-*.epub dilema-latest.epub
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "feed: $(date -u +%Y-%m-%d)" && git push
