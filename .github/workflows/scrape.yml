name: Scrape Dilema Veche

on:
  schedule:
    - cron: '0 7 * * 4'  # joi 07:00 UTC = 09:00 ora României
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run scraper
        run: bun run scrape
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml

      - name: Commit feed
        run: |
          git config user.name "dilema-rss"
          git config user.email "bot@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "feed: $(date -u +%Y-%m-%d)" && git push
